name: audioscribe
description: "O'zbek, rus va ingliz tillaridagi audio va ovozli xabarlarni matnga o'giruvchi, tahlil qiluvchi va xulosa chiqaruvchi ilova."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  record: ^5.2.0
  audioplayers: ^6.1.0
  file_picker: ^8.1.7
  receive_sharing_intent: ^1.8.0
  http: ^1.3.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  intl: ^0.19.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
